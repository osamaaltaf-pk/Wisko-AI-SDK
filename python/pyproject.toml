[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisko"
version = "1.0.0"
description = "Python SDK for the Wisko Developer API: whiteboard explainer videos from images and narration or a prompt."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
include = ["wisko*"]
